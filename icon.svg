<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- RedactNook: white document on the brand blue, with a redaction bar across it.
       Reads at 32px: the bar is the product. -->
  <rect width="100" height="100" rx="22" fill="#2563eb"/>
  <!-- document -->
  <path d="M32 20h24l14 14v46a4 4 0 0 1-4 4H32a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z" fill="#ffffff"/>
  <!-- folded corner -->
  <path d="M56 20l14 14H56V20z" fill="#bfdbfe"/>
  <!-- text lines -->
  <g fill="#2563eb">
    <rect x="36" y="42" width="30" height="4" rx="2" opacity=".35"/>
    <rect x="36" y="52" width="30" height="4" rx="2" opacity=".35"/>
    <rect x="36" y="70" width="30" height="4" rx="2" opacity=".35"/>
  </g>
  <!-- the redaction bar: opaque black, the thing the tool exists to do -->
  <rect x="33" y="59" width="36" height="9" rx="2" fill="#0b0b10"/>
</svg>